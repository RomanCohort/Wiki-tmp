<style>
/* Wiki integration: all styles are scoped to #circure-backbone. No libraries, fonts or network calls required. */
body{margin:0;background:#fff}
#circure-backbone{--ink:#274538;--muted:#64766c;--mint:#e7f5ee;--paper:#fffdf5;--border:#d5e5d9;--accent:#317c63;font-family:"Segoe UI","Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;color:var(--ink);max-width:1660px;margin:auto;padding:36px 26px;line-height:1.6;text-align:left;font-size:16px}

#circure-backbone .workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:stretch}
#circure-backbone .panel{border:1px solid var(--border);border-radius:18px;background:var(--paper);overflow:hidden}
#circure-backbone .map-panel,#circure-backbone .info-panel{height:var(--panel-height,920px)}
#circure-backbone .map-panel{display:flex;flex-direction:column}
#circure-backbone .panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 24px;background:var(--mint);border-bottom:1px solid var(--border)}
#circure-backbone .panel-head h2{font-size:19px;font-weight:650;line-height:1.4}
#circure-backbone .small{font-size:13px;color:var(--muted)}
#circure-backbone .tools{padding:16px 20px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
#circure-backbone button,#circure-backbone select,#circure-backbone input{font:inherit}
#circure-backbone button{cursor:pointer;color:var(--ink)}
#circure-backbone button:focus-visible,#circure-backbone select:focus-visible,#circure-backbone input:focus-visible,#circure-backbone a:focus-visible{outline:3px solid #9370b2;outline-offset:3px}

#circure-backbone .check{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
#circure-backbone input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
#circure-backbone .lookup{margin:14px 20px 0;display:flex;align-items:center;gap:12px}
#circure-backbone .lookup label{font-size:13px;white-space:nowrap;color:var(--muted)}
#circure-backbone select{min-width:0;width:100%;font-size:13px;border:1px solid var(--border);border-radius:6px;padding:7px 10px;color:var(--ink);background:#fff}
#circure-backbone .map-viewport{overflow:auto}
#circure-backbone #plasmid-map{display:block;width:100%;height:100%;min-width:0}
#circure-backbone svg text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
#circure-backbone .feature{cursor:pointer;outline:none}
#circure-backbone .feature .glyph{stroke-width:1.15}
#circure-backbone .leader{fill:none;stroke:#b8ccc0;stroke-width:1.05;pointer-events:none}
#circure-backbone .feature .label-bg,#circure-backbone .feature .inline-label-bg{fill:transparent;stroke:transparent;opacity:0;pointer-events:none}
#circure-backbone .feature .label{fill:var(--ink);font-size:22px;font-weight:500;dominant-baseline:middle;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round;pointer-events:all;cursor:pointer}
#circure-backbone .feature .inline-label{fill:var(--ink);font-size:14.5px;font-weight:700;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round;pointer-events:all;cursor:pointer}
#circure-backbone .feature:hover .label-bg,#circure-backbone .feature:focus-visible .label-bg,#circure-backbone .feature:hover .inline-label-bg,#circure-backbone .feature:focus-visible .inline-label-bg{fill:#e5f3e9;stroke:#75a98a;opacity:.95}
#circure-backbone .feature.active .label-bg,#circure-backbone .feature.active .inline-label-bg{fill:#ffdf72;stroke:#a97811;stroke-width:1.2;opacity:1}
#circure-backbone .feature:hover .label,#circure-backbone .feature:focus-visible .label{font-weight:700;fill:#24694f}
#circure-backbone .feature.active .label{font-weight:700;fill:#205a43}
#circure-backbone .feature .hit{fill:transparent;stroke:none}
#circure-backbone .feature:hover .glyph,#circure-backbone .feature:focus-visible .glyph{stroke:#377459;stroke-width:2.5}
#circure-backbone .feature.active .glyph{stroke:#254d3b;stroke-width:2.6}
#circure-backbone .ring{fill:none;stroke:#9db6a6;stroke-width:1.4}
#circure-backbone .tick{stroke:#bdcfc3;stroke-width:1}
#circure-backbone .tick-number{font-size:12px;fill:#718e7b;text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
#circure-backbone .center-name{font-size:22px;font-weight:700;fill:var(--ink);text-anchor:middle}
#circure-backbone .center-meta{font-size:15px;fill:#748578;text-anchor:middle}
#circure-backbone .center-button{cursor:pointer;outline:none}
#circure-backbone .center-button:focus-visible rect{stroke:#377459;stroke-width:2}
#circure-backbone .map-viewport{flex:1;min-height:0;overflow:hidden;padding:0 8px}
#circure-backbone .map-foot{flex:none;padding:0 22px 15px}
#circure-backbone .legend{display:flex;flex-wrap:wrap;gap:7px 16px;padding:8px 0 0;font-size:12px;color:var(--muted)}
#circure-backbone .legend span{display:inline-flex;align-items:center;gap:6px}
#circure-backbone .dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--c)}
#circure-backbone .info-panel{display:flex;flex-direction:column;min-height:0}
#circure-backbone .info-body{flex:1;min-height:0;overflow:auto;padding:22px 26px 26px;text-align:left}
#circure-backbone .part-category{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:9px}
#circure-backbone #part-title{font-size:29px;line-height:1.25;letter-spacing:-.5px;font-weight:700;margin-bottom:6px;overflow-wrap:anywhere}
#circure-backbone .registered-title{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:18px}
#circure-backbone .metadata{display:grid;grid-template-columns:1fr 1fr;gap:13px 22px;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:0 0 19px}
#circure-backbone .metadata [hidden]{display:none!important}
#circure-backbone dt{font-size:12px;color:var(--muted);margin-bottom:3px}
#circure-backbone dd{margin:0;font-size:15px;line-height:1.55;overflow-wrap:anywhere}
#circure-backbone .registry-link{color:#3b7758;text-decoration:underline;text-underline-offset:3px;font-weight:650}
#circure-backbone .content-heading{font-size:17px;font-weight:650;margin:0 0 8px}
#circure-backbone .function{font-size:15px;line-height:1.7;max-width:none}
#circure-backbone .function p+p{margin-top:12px}
#circure-backbone .citation{color:#24684f;font-size:inherit;font-weight:500}
#circure-backbone .related-elements{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;padding-top:15px;border-top:1px solid var(--border)}
#circure-backbone .related-elements[hidden]{display:none!important}
#circure-backbone .related-heading{flex-basis:100%;font-size:14px;font-weight:650;color:var(--ink)}
#circure-backbone .related-link{border:1px solid #c7ddd0;border-radius:999px;background:#fff;color:#28664f;padding:6px 11px;font-size:12px;line-height:1.4;cursor:pointer}
#circure-backbone .related-link:hover,#circure-backbone .related-link:focus-visible{background:#e5f3e9;border-color:#75a98a}
#circure-backbone .role-note{margin-top:22px;border-left:3px solid #afd3bb;padding:0 0 0 15px;font-size:14px;color:var(--muted);line-height:1.75}
#circure-backbone .role-note strong{display:block;color:var(--ink);font-size:14px;font-weight:650;margin-bottom:4px}
#circure-backbone .selection-position{font-size:13px;color:var(--muted);white-space:nowrap}
#circure-backbone .statusline{margin-top:16px;font-size:12px;color:var(--muted)}
#circure-backbone .nojs{margin:20px 0;padding:16px;border:1px solid var(--border)}
@media(min-width:1700px){#circure-backbone{padding-top:44px}}
@media(max-width:1050px){#circure-backbone{padding:24px 16px}#circure-backbone .workspace{gap:16px}#circure-backbone .info-body{padding:20px}#circure-backbone #part-title{font-size:25px}#circure-backbone .panel-head{padding:14px 18px}#circure-backbone .panel-head .small{display:none}}
@media(max-width:800px){#circure-backbone .workspace{grid-template-columns:1fr}#circure-backbone .map-panel,#circure-backbone .info-panel{height:var(--panel-height,920px);min-height:650px}#circure-backbone h1{font-size:29px}#circure-backbone .intro{font-size:14px}#circure-backbone .info-body{padding:23px}#circure-backbone .tools{justify-content:flex-start}#circure-backbone .metadata{gap:14px}#circure-backbone .panel-head .small{display:block}}
@media(prefers-reduced-motion:no-preference){#circure-backbone .info-body.changed{animation:cc-reveal .18s ease-out}@keyframes cc-reveal{from{opacity:.65}to{opacity:1}}}
@media(max-width:520px){#circure-backbone .metadata{gap:12px}}
@media print{#circure-backbone{padding:0}#circure-backbone .workspace{grid-template-columns:1fr 1fr;gap:15px}#circure-backbone .map-panel,#circure-backbone .info-panel{height:880px}#circure-backbone .tools,#circure-backbone .lookup{display:none}#circure-backbone #plasmid-map{min-width:0}#circure-backbone .info-body{padding:18px}#circure-backbone h1{font-size:24px}#circure-backbone #part-title{font-size:23px}}
</style>

<script>
(()=>{'use strict';
const DATA={"plasmid": "pCirCure-circMEV", "length": 5267, "verified": "2026-10-09", "parts": [{"id": "t7p", "name": "T7 promoter", "start": 402, "end": 434, "strand": 1, "cat": "backbone", "description": "Promoter for in vitro transcription by T7 RNA polymerase. The 33 bp part is the 18 bp T7 consensus at 415–432 preceded by 13 bp of vector sequence and ending in the GGG at 432–434, which becomes the first three bases of the transcript. Fixing the 5′ end at GGG is what makes PIE precursor folding reproducible between batches.", "registry": "BBa_26KIMH8W", "ranges": [[402, 434]], "classification": "Basic", "type": "T7 RNA Polymerase Promoter", "functionalDescription": "The T7 promoter is a DNA recognition site for bacteriophage T7 RNA polymerase. When the polymerase and promoter are present in an in-vitro transcription reaction, initiation occurs at the defined start and produces RNA from the downstream template. Transcription yield and end heterogeneity depend on promoter context and reaction conditions.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "T7 promoter with GGG initiator"}, {"id": "oha5", "name": "Outer Homology Arm · 5′", "start": 465, "end": 484, "strand": 1, "cat": "circ", "description": "This 20 bp 5′ outer homology arm pairs with the complementary 3′ outer arm at 2927–2946. The outer pair helps fold the linear precursor so the separated intron halves approach one another before self-splicing. It acts with the inner-arm pair, which provides a second, more local alignment around the splice sites.", "registry": null, "ranges": [[465, 484]], "classification": "Subfeature", "type": "Homology arm", "parent": "BBa_26T5SEQR", "functionalDescription": "Homology arms are complementary sequences placed around a permuted group I intron precursor. Pairing between the 5′ and 3′ outer arms can bring distant splice-region sequences closer in the folded precursor and improve splicing of long inserted sequences; the effect is sequence- and structure-dependent.", "functionalRefs": ["Wesselhoeft et al., 2018"], "parentClass": "Basic"}, {"id": "scar2", "name": "Intron Scar 2", "start": 723, "end": 746, "strand": 1, "cat": "circ", "description": "The 24 nt of the upstream intron half retained in the spliced product. In the mature circle it sits directly against Intron Scar 1 across the back-splice junction, and that scar–scar sequence is the signature read out by junction-spanning RT-PCR.", "registry": null, "ranges": [[723, 746]], "classification": "Annotation", "type": "Circularisation annotation", "functionalDescription": "Group I introns fold into catalytic RNA structures. In a permuted intron–exon design, the precursor is rearranged so that splicing joins the exon ends into a circle; the reaction depends on correct RNA folding, splice-site pairing and compatible flanking sequences.", "functionalRefs": ["Wesselhoeft et al., 2018"]}, {"id": "iha5", "name": "Inner Homology Arm · 5′", "start": 747, "end": 766, "strand": 1, "cat": "circ", "description": "This 20 bp 5′ inner homology arm pairs with the complementary 3′ inner arm at 2694–2713. The inner pair aligns the two permuted T4 td intron halves near the splice junction, helping reconstitute the group I ribozyme in the intended register. It is a subregion of the PIE 5′ half; its folding role depends on the paired precursor context.", "registry": null, "ranges": [[747, 766]], "classification": "Subfeature", "type": "Homology arm", "parent": "BBa_26T5SEQR", "functionalDescription": "The inner homology arm forms a second complementary interaction closer to the splice junction. Together with its 3′ partner it can help align the intron halves locally, while the outer pair supports longer-range precursor folding.", "functionalRefs": ["Wesselhoeft et al., 2018"], "parentClass": "Basic"}, {"id": "ires", "name": "synIRES-RC25", "start": 823, "end": 1488, "strand": 1, "cat": "trans", "description": "Circular RNA has no 5′ cap, so translation has to be IRES-driven. synIRES-RC25 is rebuilt on a CVB3 / HRV-2 type I–II IRES scaffold: long stem-loops that hinder circularisation are shortened, and an eIF4G-binding aptamer is embedded in domain V so that the eIF4G–eIF4A complex is recruited directly upstream of the start codon.", "registry": "BBa_26DGJ5ZY", "ranges": [[823, 1488]], "classification": "Basic", "type": "Ribosome Entry Site", "functionalDescription": "The synthetic IRES combines a human rhinovirus B3-derived structured element with an inserted eIF4G-binding aptamer. In published circRNA reporter experiments, IRES sequence and aptamer insertion position affected translation, with some designs improving output while disruptive placements reduced it; the result is construct-specific.", "functionalRefs": ["Chen et al., 2023"], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "synIRES-RC25"}, {"id": "apt", "name": "Apt-eIF4G", "start": 1214, "end": 1253, "strand": 1, "cat": "trans", "description": "A 40 nt RNA aptamer binding the HEAT-1 domain of eIF4G. As a stand-alone element it can recruit eIF4G–eIF4A to any circular or linear RNA, bypassing the eIF4E–cap requirement. Here it is not inserted separately but embedded inside domain V of synIRES-RC25.", "registry": "BBa_26X4AOBB", "ranges": [[1214, 1253]], "classification": "Basic", "type": "Aptamer", "functionalDescription": "This aptamer is an RNA motif selected to bind eIF4G, a scaffold protein in translation-initiation complexes. Aptamer placement can alter translation in a structured IRES: published circRNA experiments found beneficial and disruptive insertion sites, showing that binding potential alone does not predict the outcome.", "functionalRefs": ["Chen et al., 2023"], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "Apt-eIF4G"}, {"id": "tpa", "name": "tPA leader", "start": 1504, "end": 1599, "strand": 1, "cat": "traffic", "description": "The 32-residue signal peptide plus pro-peptide of human tissue plasminogen activator (MDAMKRGLCCVLLLCGAVFVSPSQEIHARFRR). Placed at the 5′ end of the antigen cassette, it takes the nascent polypeptide into the ER–Golgi pathway; the MITD at the other end of the cassette then holds it in the MHC trafficking compartments rather than letting it leave the cell.", "registry": "BBa_26H5MIQD", "ranges": [[1504, 1599]], "classification": "Basic", "type": "Signal Peptide", "functionalDescription": "The tPA leader is a signal peptide that can direct a nascent polypeptide to the endoplasmic reticulum through signal-recognition-particle-dependent targeting. In a fusion protein this can support entry into the secretory pathway, but cleavage, secretion and antigen processing depend on the complete protein and host cell.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "tPA signal and pro-peptide secretion leader"}, {"id": "ep1", "name": "TROP2 CTL1", "start": 1606, "end": 1632, "strand": 1, "cat": "epitope", "description": "HLA-A*02:01-restricted CTL epitope from TROP2 (SVCWCVNSV). TROP2 is strongly over-expressed in triple-negative breast cancer and is the target of the approved ADC sacituzumab govitecan.", "registry": "BBa_2615OQ94", "ranges": [[1606, 1632]], "classification": "Basic", "type": "Polypeptide Domain", "functionalDescription": "An HLA class I CTL epitope is a short peptide generated from a protein, loaded onto an HLA-I molecule and displayed for recognition by CD8 T cells. A predicted HLA-A*02:01 sequence is a candidate, not proof of intracellular processing, surface presentation or T-cell recognition.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "TROP2 HLA-A*02:01 CTL epitope SVCWCVNSV"}, {"id": "l1", "name": "Linker 1", "start": 1633, "end": 1647, "strand": 1, "cat": "linker", "description": "Five-residue flexible linker (GSGGS) between TROP2 CTL1 and TROP2 CTL2. Flexible spacers let neighbouring epitopes fold independently and give the proteasome an accessible cleavage context, so each epitope is released intact instead of being destroyed at the junction.", "registry": "BBa_26B8OJKK", "ranges": [[1633, 1647]], "classification": "Basic", "type": "Engineered Region", "functionalDescription": "Glycine/serine-rich linkers are commonly used to connect protein domains because glycine permits backbone flexibility and serine improves aqueous compatibility. Linker length and sequence can affect folding, proteolysis and domain interaction, so the encoded junction needs to be evaluated in the full fusion protein.", "functionalRefs": [], "match": "Same encoded GSGGS peptide; DNA sequence differs from Registry record.", "status": "published", "registryTitle": "GSGGS flexible linker"}, {"id": "ep2", "name": "TROP2 CTL2", "start": 1648, "end": 1674, "strand": 1, "cat": "epitope", "description": "Second HLA-A*02:01-restricted TROP2 epitope (RLFRERYRL). Each of the four target antigens contributes two epitopes, so one antigen staying presentable is enough to keep that target covered.", "registry": "BBa_26RVX9FC", "ranges": [[1648, 1674]], "classification": "Basic", "type": "Polypeptide Domain", "functionalDescription": "An HLA class I CTL epitope is a short peptide generated from a protein, loaded onto an HLA-I molecule and displayed for recognition by CD8 T cells. A predicted HLA-A*02:01 sequence is a candidate, not proof of intracellular processing, surface presentation or T-cell recognition.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "TROP2 HLA-A*02:01 CTL epitope RLFRERYRL"}, {"id": "l2", "name": "Linker 2", "start": 1675, "end": 1689, "strand": 1, "cat": "linker", "description": "This 15 bp GSGGS coding spacer sits between the two TROP2 CTL fragments and B7-H4 CTL1. It maintains the single reading frame while placing a flexible five-residue segment between antigen-derived sequences. The same peptide linker is used throughout the array; its intended role is to keep epitope junctions accessible during processing, which remains to be verified in the expressed construct.", "registry": "BBa_26B8OJKK", "ranges": [[1675, 1689]], "classification": "Basic", "type": "Engineered Region", "functionalDescription": "Glycine/serine-rich linkers are commonly used to connect protein domains because glycine permits backbone flexibility and serine improves aqueous compatibility. Linker length and sequence can affect folding, proteolysis and domain interaction, so the encoded junction needs to be evaluated in the full fusion protein.", "functionalRefs": [], "match": "Same encoded GSGGS peptide; DNA sequence differs from Registry record.", "status": "published", "registryTitle": "GSGGS flexible linker"}, {"id": "ep3", "name": "B7-H4 CTL1", "start": 1690, "end": 1716, "strand": 1, "cat": "epitope", "description": "HLA-A*02:01-restricted epitope from B7-H4 / VTCN1 (WLKEGVLGL). B7-H4 is an immune-checkpoint ligand with restricted expression in healthy tissue and up-regulation in TNBC, so it serves both as a tumour antigen and as a suppressive signal in the tumour microenvironment.", "registry": "BBa_26Y46OKH", "ranges": [[1690, 1716]], "classification": "Basic", "type": "Polypeptide Domain", "functionalDescription": "An HLA class I CTL epitope is a short peptide generated from a protein, loaded onto an HLA-I molecule and displayed for recognition by CD8 T cells. A predicted HLA-A*02:01 sequence is a candidate, not proof of intracellular processing, surface presentation or T-cell recognition.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "B7-H4 HLA-A*02:01 CTL epitope WLKEGVLGL"}, {"id": "l3", "name": "Linker 3", "start": 1717, "end": 1731, "strand": 1, "cat": "linker", "description": "This 15 bp GSGGS spacer separates the two B7-H4-derived CTL sequences. It preserves the continuous fusion-protein reading frame and inserts a glycine/serine-rich junction instead of directly fusing the epitopes. The design aims to support proteolytic release of each peptide, but does not by itself demonstrate correct cleavage or HLA presentation.", "registry": "BBa_26B8OJKK", "ranges": [[1717, 1731]], "classification": "Basic", "type": "Engineered Region", "functionalDescription": "Glycine/serine-rich linkers are commonly used to connect protein domains because glycine permits backbone flexibility and serine improves aqueous compatibility. Linker length and sequence can affect folding, proteolysis and domain interaction, so the encoded junction needs to be evaluated in the full fusion protein.", "functionalRefs": [], "match": "Same encoded GSGGS peptide; DNA sequence differs from Registry record.", "status": "published", "registryTitle": "GSGGS flexible linker"}, {"id": "ep4", "name": "B7-H4 CTL2", "start": 1732, "end": 1758, "strand": 1, "cat": "epitope", "description": "This 27 bp coding segment encodes AVFADQVIV, the second selected B7-H4/VTCN1-derived HLA-A*02:01 CTL epitope in the array. It follows B7-H4 CTL1 after a GSGGS spacer, giving the target two candidate peptide sequences in the same construct. This is intended to broaden antigen-specific recognition; processing, HLA binding and T-cell activity need experimental validation.", "registry": "BBa_264AFCJ7", "ranges": [[1732, 1758]], "classification": "Basic", "type": "Polypeptide Domain", "functionalDescription": "An HLA class I CTL epitope is a short peptide generated from a protein, loaded onto an HLA-I molecule and displayed for recognition by CD8 T cells. A predicted HLA-A*02:01 sequence is a candidate, not proof of intracellular processing, surface presentation or T-cell recognition.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "B7-H4 HLA-A*02:01 CTL epitope AVFADQVIV"}, {"id": "l4", "name": "Linker 4", "start": 1759, "end": 1773, "strand": 1, "cat": "linker", "description": "This 15 bp GSGGS spacer marks the transition from B7-H4 CTL2 to the extended Nectin-4 CTL1 fragment. It keeps both tumour-antigen sequences in one open reading frame while defining a flexible boundary between them. The spacer is part of the antigen-array architecture, not an additional epitope.", "registry": "BBa_26B8OJKK", "ranges": [[1759, 1773]], "classification": "Basic", "type": "Engineered Region", "functionalDescription": "Glycine/serine-rich linkers are commonly used to connect protein domains because glycine permits backbone flexibility and serine improves aqueous compatibility. Linker length and sequence can affect folding, proteolysis and domain interaction, so the encoded junction needs to be evaluated in the full fusion protein.", "functionalRefs": [], "match": "Same encoded GSGGS peptide; DNA sequence differs from Registry record.", "status": "published", "registryTitle": "GSGGS flexible linker"}, {"id": "ep5", "name": "Nectin4 CTL1", "start": 1774, "end": 1815, "strand": 1, "cat": "epitope", "description": "Extended HLA-A*02:01-restricted epitope from PVRL4 / Nectin-4 (FQARLRLRVLVPPL, 14 aa). Nectin-4 is the target of enfortumab vedotin and is re-expressed in TNBC. This is the one extended insert in the array: two predicted 9-mers overlap by four residues in the native Nectin-4 sequence, so they are carried as a single peptide rather than synthesised separately with a duplicated RLRV and an extra linker.", "registry": "BBa_262M4VRL", "ranges": [[1774, 1815]], "classification": "Basic", "type": "Polypeptide Domain", "functionalDescription": "An HLA class I CTL epitope is a short peptide generated from a protein, loaded onto an HLA-I molecule and displayed for recognition by CD8 T cells. A predicted HLA-A*02:01 sequence is a candidate, not proof of intracellular processing, surface presentation or T-cell recognition.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "publi tion.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "PVRL4 HLA-A*02:01 CTL epitope AVTSEFHLV"}, {"id": "l6", "name": "Linker 6", "start": 1858, "end": 1872, "strand": 1, "cat": "linker", "description": "This 15 bp GSGGS spacer separates Nectin-4 CTL2 from LIV-1 CTL2 and keeps both antigen-derived fragments in the same reading frame. The short glycine/serine-rich segment limits direct fusion of neighbouring epitopes while keeping the eight-slot array compact.", "registry": "BBa_26B8OJKK", "ranges": [[1858, 1872]], "classification": "Basic", "type": "Engineered Region", "functionalDescription": "Glycine/serine-rich linkers are commonly used to connect protein domains because glycine permits backbone flexibility and serine improves aqueous compatibility. Linker length and sequence can affect folding, proteolysis and domain interaction, so the encoded junction needs to be evaluated in the full fusion protein.", "functionalRefs": [], "match": "Same encoded GSGGS peptide; DNA sequence differs from Registry record.", "status": "published", "registryTitle": "GSGGS flexible linker"}, {"id": "ep7", "name": "LIV-1 CTL2", "start": 1873, "end": 1899, "strand": 1, "cat": "epitope", "description": "HLA-A*02:01-restricted epitope from LIV-1 / SLC39A6 (ZIP6) (GVATLAWMV). LIV-1 is a zinc transporter linked to the epithelial–mesenchymal transition in breast cancer and is the target of ladiratuzumab vedotin.", "registry": "BBa_26T7Q0VT", "ranges": [[1873, 1899]], "classification": "Basic", "type": "Polypeptide Domain", "functionalDescription": "An HLA class I CTL epitope is a short peptide generated from a protein, loaded onto an HLA-I molecule and displayed for recognition by CD8 T cells. A predicted HLA-A*02:01 sequence is a candidate, not proof of intracellular processing, surface presentation or T-cell recognition.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "LIV-1 HLA-A*02:01 CTL epitope GVATLAWMV"}, {"id": "l7", "name": "Linker 7", "start": 1900, "end": 1914, "strand": 1, "cat": "linker", "description": "This 15 bp GSGGS spacer separates the two LIV-1 CTL fragments. It is translated as a flexible five-residue linker in the single antigen fusion and provides a defined junction before the final epitope slot. The plasmid uses a codon-distinct DNA instance while encoding the same GSGGS peptide used at other array boundaries.", "registry": "BBa_26B8OJKK", "ranges": [[1900, 1914]], "classification": "Basic", "type": "Engineered Region", "functionalDescription": "Glycine/serine-rich linkers are commonly used to connect protein domains because glycine permits backbone flexibility and serine improves aqueous compatibility. Linker length and sequence can affect folding, proteolysis and domain interaction, so the encoded junction needs to be evaluated in the full fusion protein.", "functionalRefs": [], "match": "Same encoded GSGGS peptide; DNA sequence differs from Registry record.", "status": "published", "registryTitle": "GSGGS flexible linker"}, {"id": "ep8", "name": "LIV-1 CTL3", "start": 1915, "end": 1941, "strand": 1, "cat": "epitope", "description": "This 27 bp segment encodes GLHNFSDGL, the second selected LIV-1/SLC39A6-derived HLA-A*02:01 CTL epitope and the final epitope slot. It is followed by the final GSGGS linker, which joins the 336 bp antigen array in frame to the four-copy mC3d-P28 molecular adjuvant. This position defines the antigen-to-adjuvant boundary in the fusion.", "registry": "BBa_26UDJYOG", "ranges": [[1915, 1941]], "classification": "Basic", "type": "Polypeptide Domain", "functionalDescription": "An HLA class I CTL epitope is a short peptide generated from a protein, loaded onto an HLA-I molecule and displayed for recognition by CD8 T cells. A predicted HLA-A*02:01 sequence is a candidate, not proof of intracellular processing, surface presentation or T-cell recognition.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "LIV-1 HLA-A*02:01 CTL epitope GLHNFSDGL"}, {"id": "l8", "name": "GS linker 8", "start": 1942, "end": 1956, "strand": 1, "cat": "linker", "description": "GSGGS joining the epitope array in frame to the 4× mC3d-P28 adjuvant, so the two domains fold independently. The XhoI site immediately downstream (CTCGAG, 1,957–1,962, encoding Leu-Glu) marks the design boundary between the exchangeable antigen cassette and the adjuvant module.", "registry": "BBa_26B8OJKK", "ranges": [[1942, 1956]], "classification": "Basic", "type": "Engineered Region", "functionalDescription": "A glycine/serine-rich linker is a flexible peptide spacer between adjacent protein domains. This instance marks the junction between the epitope array and the adjuvant; linker length can influence domain spacing, folding and proteolytic processing.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "GSGGS flexible linker"}, {"id": "mc3d", "name": "4× murine C3d-P28 molecular adjuvant", "start": 1963, "end": 2370, "strand": 1, "cat": "adjuvant", "description": "Four tandem copies of the murine C3d-P28 peptide (KFLNTAKDRNRWEEPDQQLYNVEATSYALL per copy, separated by GSGGS spacers), registered and handled as a single 408 bp part. C3d is a complement C3 degradation product whose minimal active core P28 binds CR2 / CD21 on B cells, tethering the antigen–adjuvant fusion to follicular dendritic cells and B cells, lowering the B-cell activation threshold and enhancing germinal-centre responses. Potency depends on multimerisation, which is why the copies are arrayed rather than used singly.", "registry": "BBa_26TV21B9", "ranges": [[1963, 2370]], "classification": "Basic", "type": "CDS", "mapLabel": "mC3dP28 ×4", "functionalDescription": "C3d-derived P28 motifs can bind complement receptor 2 (CR2/CD21) on B cells and follicular dendritic cells. Genetic fusion of C3d or P28 repeats to model antigens enhanced immune responses in animal studies, consistent with complement-receptor co-engagement; this does not establish the same magnitude or mechanism for every antigen or vaccine format.", "functionalRefs": ["Dempsey et al., 1996", "Bower and Ross, 2006"], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "4x murine C3d-P28 molecular adjuvant"}, {"id": "mitd", "name": "MITD", "start": 2386, "end": 2550, "strand": 1, "cat": "traffic", "description": "The transmembrane and cytoplasmic tail of HLA-A*02:01 (IVGIVAGLAVLAVVVIGAVVATVMCRRKSSGGKGGSYSQAASSDSAQGSDVSLTA). Fused to the C-terminus of the antigen cassette, it routes the antigen into the vesicular trafficking pathway shared by MHC-I and MHC-II, improving cross-presentation and CD4+ help.", "registry": "BBa_26DFSBOC", "ranges": [[2386, 2550]], "classification": "Basic", "type": "Peptide Localization Signal", "functionalDescription": "The MHC-I trafficking domain comprises membrane-proximal trafficking information used to alter intracellular routing of an attached antigen. Experimental RNA-vaccine and dendritic-cell studies report enhanced antigen presentation for some MITD fusions; efficacy depends on construct design and cell maturation state.", "functionalRefs": ["Kreiter et al., 2008"], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "MITD MHC class I trafficking domain"}, {"id": "flag", "name": "FLAG", "start": 2560, "end": 2583, "strand": 1, "cat": "tag", "description": "The eight-residue FLAG tag (DYKDDDDK) at the C-terminus of the fusion protein, after MITD. Anti-FLAG Western blot and flow cytometry use it to confirm that the circular RNA is translated into the full-length fusion inside cells.", "registry": "BBa_26ETK4O5", "ranges": [[2560, 2583]], "classification": "Basic", "type": "Tag", "functionalDescription": "The FLAG tag is an eight-residue antibody epitope used as a general biochemical handle for immunodetection, affinity capture and localization of recombinant proteins. Tag accessibility and effects on protein behaviour should be checked in the expressed fusion.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "FLAG epitope tag"}, {"id": "iha3", "name": "Inner Homology Arm · 3′", "start": 2694, "end": 2713, "strand": 1, "cat": "circ", "description": "This 20 bp 3′ inner homology arm pairs with the 5′ inner arm at 747–766. It is part of the registered PIE 3′ half and contributes to alignment of the two intron halves around the splice junction. It is shown separately so its position can be compared with its upstream partner; it does not function independently of the paired precursor.", "registry": null, "ranges": [[2694, 2713]], "classification": "Subfeature", "type": "Homology arm", "parent": "BBa_26P7AUA8", "functionalDescription": "This 3′ inner arm pairs with its 5′ partner near the splice junction. PIE designs use such paired sequences to support local alignment of intron regions; the arm is not expected to act as an independent catalytic RNA element.", "functionalRefs": ["Wesselhoeft et al., 2018"], "parentClass": "Composite"}, {"id": "oha3", "name": "Outer Homology Arm · 3′", "start": 2927, "end": 2946, "strand": 1, "cat": "circ", "description": "This 20 bp 3′ outer homology arm pairs with the 5′ outer arm at 465–484. It belongs to the registered PIE 3′ half and helps bring the separated intron segments together during precursor folding. This is the long-range outer pair; the inner arms provide a second alignment closer to the splice sites.", "registry": null, "ranges": [[2927, 2946]], "classification": "Subfeature", "type": "Homology arm", "parent": "BBa_26P7AUA8", "functionalDescription": "This 3′ outer arm pairs with the 5′ outer arm across the precursor. In PIE architectures, outer-arm pairing can promote proximity of splice regions when the insert is long; actual circularisation still depends on the complete precursor fold and reaction conditions.", "functionalRefs": ["Wesselhoeft et al., 2018"], "parentClass": "Composite"}, {"id": "polya", "name": "polyA25", "start": 2947, "end": 2971, "strand": 1, "cat": "utr", "description": "This 25 bp poly(A) tract lies after the 3′ outer homology arm and before the NotI linearisation site. It is part of the plasmid-borne precursor architecture and is removed during PIE splicing rather than serving as a poly(A) tail on the mature circle. The map shows it as a separate regulatory/processing segment at the downstream boundary.", "registry": "BBa_26REEYOT", "ranges": [[2947, 2971]], "classification": "Basic", "type": "PolyA Sequence", "functionalDescription": "A short polyadenosine tract can provide a binding platform for poly(A)-binding proteins in RNA contexts. Here the tract is part of the DNA-encoded PIE precursor and lies outside the mature circular coding sequence after processing, so it should not be interpreted as a conventional poly(A) tail on the final circRNA.", "functionalRefs": [], "match": "Exact DNA sequence and boundaries.", "status": "published", "registryTitle": "polyA25 internal poly(A) segment"}, {"id": "t7t", "name": "T7 terminator", "start": 2980, "end": 3027, "strand": 1, "cat": "backbone", "description": "This registered T7 terminator sits in the bacterial backbone downstream of NotI. In a circular-plasmid transcription context it can terminate T7 RNA polymerase; for run-off preparation, linearisation at NotI instead defines the template end. The terminator belongs to the DNA-template workflow and is not intended to remain in the mature circRNA.", "registry": "BBa_K5441009", "ranges": [[2980, 3027]], "classification": "Basic", "type": "Terminator", "functionalDescription": "A T7 terminator is a DNA sequence that can reduce read-through by T7 RNA polymerase. Termination efficiency depends on the terminator sequence and transcription conditions; when a template is linearised downstream, the physical DNA end can instead define the run-off transcript boundary.", "functionalRefs": [], "alternatives": [{"name": "BBa_K5441009", "slug": "bba-k5441009", "classification": "Basic", "type": "Terminator"}], "external": true}, {"id": "ori", "name": "ori", "start": 3448, "end": 4036, "strand": -1, "cat": "backbone", "description": "This pUC/pMB1-derived origin is a feature of the commercial vector backbone, providing high-copy replication during bacterial propagation by the gene-synthesis vendor. It is outside the T7-driven vaccine precursor and has no role in translation after transcription. Our team did not perform bacterial culturing, transformation or plasmid amplification; the complete plasmid was ordered endotoxin-free and supplied ready for template linearisation.", "registry": "BBa_K4514036", "ranges": [[3448, 4036]], "classification": "Basic", "type": "Miscellaneous", "functionalDescription": "A plasmid origin is the cis-acting DNA region where host replication machinery initiates plasmid replication. The pUC/pMB1-derived origin supports plasmid propagation in compatible E. coli strains; copy number and stability depend on the origin variant and host background.", "functionalRefs": [], "alternatives": [{"name": "BBa_K4514036", "slug": "bba-k4514036", "classification": "Basic", "type": "Miscellaneous"}], "external": true}, {"id": "ampr", "name": "AmpR", "start": 4207, "end": 5067, "strand": -1, "cat": "backbone", "description": "This bla coding region produces β-lactamase, conferring ampicillin resistance as a selectable marker in the commercial vector backbone. It is a feature of the bacterial vector rather than the mammalian vaccine payload. Because all plasmids were ordered directly from a commercial gene-synthesis vendor, bacterial selection, transformation and overnight culture were not performed by our team.", "registry": "BBa_K5044024", "ranges": [[4207, 5067]], "classification": "Basic", "type": "CDS", "functionalDescription": "The bla gene encodes β-lactamase, an enzyme that hydrolyses the β-lactam ring of ampicillin. This resistance phenotype allows selection of plasmid-bearing bacteria on ampicillin-containing medium; it is a bacterial propagation marker, not a mammalian vaccine component.", "functionalRefs": [], "alternatives": [{"name": "BBa_K5044024", "slug": "bba-k5044024", "classification": "Basic", "type": "CDS"}], "external": true}, {"id": "amprp", "name": "AmpR promoter", "start": 5068, "end": 5172, "strand": -1, "cat": "backbone", "description": "This promoter drives the downstream bla/β-lactamase resistance gene in the bacterial backbone. As a feature of the supplied vector, it supports antibiotic selection during bacterial propagation. It is independent of the upstream T7 promoter, which is used for cell-free in vitro transcription of the PIE precursor.", "registry": "BBa_K4696010", "ranges": [[5068, 5172]], "classification": "Basic", "type": "CDS", "functionalDescription": "A bacterial promoter recruits RNA polymerase to initiate transcription of the downstream gene. This promoter controls bla expression in the plasmid backbone and is distinct from the T7 promoter used for in-vitro transcription.", "functionalRefs": [], "alternatives": [{"name": "BBa_K4696010", "slug": "bba-k4696010", "classification": "Basic", "type": "CDS"}, {"name": "BBa_K5471001", "slug": "bba-k5471001", "classification": "Basic", "type": "Regulatory"}, {"name": "BBa_K5487112", "slug": "bba-k5487112", "classification": "Basic", "type": "Regulatory"}], "external": true}, {"id": "hc", "name": "HC-CIRCV1", "start": 402, "end": 1491, "strand": 1, "cat": "circ", "description": "This 1,090 bp annotation groups the T7 start, PIE circularisation region and translation-control sequence shown together in the supplied map. It is useful as a visual overview of that upstream region, but overlaps multiple separately described features and is not itself the registered PIE precursor cassette. Select the registered precursor composite to inspect the complete BBa part.", "registry": null, "ranges": [[402, 1491]], "classification": "Annotation", "type": "Circularisation annotation", "functionalDescription": "This is a source-map overview spanning multiple RNA-processing and translation-control features. It is not a single biochemical element; its component sequences carry the individual functions described for the PIE, IRES and translation-initiation modules.", "functionalRefs": ["Wesselhoeft et al., 2018"]}, {"id": "hrv", "name": "Human rhinovirus 3 IRES", "start": 823, "end": 1491, "strand": 1, "cat": "trans", "description": "This legacy 669 bp Human rhinovirus IRES annotation spans 823–1491 and overlaps the engineered synIRES-RC25 almost completely. The engineered IRES is the translation-initiation element used in the design; this broader source-map span is retained only to match the supplied annotation and should not be read as a second independent IRES module.", "registry": null, "ranges": [[823, 1491]], "classification": "Annotation", "type": "IRES annotation", "functionalDescription": "Human rhinovirus IRESs are structured viral RNA elements that support cap-independent translation initiation. The native IRES is a broader sequence module; the engineered synIRES-RC25 is the design-specific element, and activity depends on preserving its functional RNA structure.", "functionalRefs": ["Chen et al., 2023"]}, {"id": "stop", "name": "3-Frame stop", "start": 806, "end": 816, "strand": 1, "cat": "trans", "description": "This 11 bp stop cassette (TAATTGACTAA) lies inside the A-rich PABP spacer upstream of the IRES. Stop codons in all three frames are intended to terminate ribosomes entering from upstream, while productive translation begins at the IRES/Kozak-controlled start. It is a subregion of the registered 50 bp spacer, not a separate part.", "registry": null, "ranges": [[806, 816]], "classification": "Subfeature", "type": "Translation control", "parent": "BBa_260UNJNZ", "functionalDescription": "Stop codons terminate translation when encountered in the ribosomal reading frame. A three-frame stop cassette supplies termination signals for ribosomes entering from different upstream frames; its effect depends on the actual initiation site and reading frame.", "functionalRefs": [], "parentClass": "Basic"}, {"id": "utr1", "name": "HBA1 full 3′ UTR · 1", "start": 2593, "end": 2611, "strand": 1, "cat": "utr", "description": "One of the two adjacent HBA1 UTR annotations in the supplied map. Together they span 2593–2693, matching the 101 bp registered HBA1 3′ UTR. The globin-derived region is included as a regulatory element; effects described for linear mRNA do not by themselves establish a stability gain in this circular RNA.", "registry": null, "ranges": [[2593, 2611]], "classification": "Subfeature", "type": "UTR subregion", "parent": "BBa_26YWGNHS", "functionalDescription": "The human HBA1 3′ UTR contains pyrimidine-rich sequence elements that bind RNA-protein complexes associated with α-globin mRNA stability in erythroid-cell experiments. Published circRNA work also tested HBA1 UTRs and found context-dependent effects on reporter translation; those findings do not guarantee an identical effect in this construct.", "functionalRefs": ["Wang et al., 1995", "Chen et al., 2023"], "parentClass": "Composite"}, {"id": "utr2", "name": "HBA1 full 3′ UTR · 2", "start": 2612, "end": 2693, "strand": 1, "cat": "utr", "description": "One of the two adjacent HBA1 UTR annotations in the supplied map. Together they span 2593–2693, matching the 101 bp registered HBA1 3′ UTR. The globin-derived region is included as a regulatory element; effects described for linear mRNA do not by themselves establish a stability gain in this circular RNA.", "registry": null, "ranges": [[2612, 2693]], "classification": "Subfeature", "type": "UTR subregion", "parent": "BBa_26YWGNHS", "functionalDescription": "This segment is part of the HBA1 3′ UTR, whose cis-elements can bind proteins involved in RNA stability and processing. Any effect depends on which motifs are retained and on RNA context; its role in a circular RNA should be experimentally distinguished from its established function in linear α-globin mRNA.", "functionalRefs": ["Wang et al., 1995", "Chen et al., 2023"], "parentClass": "Composite"}, {"id": "ds", "name": "T4 td downstream intron", "start": 2714, "end": 2920, "strand": 1, "cat": "circ", "description": "The downstream intron segment in the permuted intron–exon precursor. It acts together with the upstream segment during group I intron self-splicing. This map annotation is a subregion of the registered PIE 3′ half (2694–2946).", "registry": null, "ranges": [[2714, 2920]], "classification": "Subfeature", "type": "Intron segment", "parent": "BBa_26P7AUA8", "functionalDescription": "Group I introns fold into catalytic RNA structures. In a permuted intron–exon design, the precursor is rearranged so that splicing joins the exon ends into a circle; the reaction depends on correct RNA folding, splice-site pairing and compatible flanking sequences.", "functionalRefs": ["Wesselhoeft et al., 2018"], "parentClass": "Composite"}, {"id": "laco", "name": "lac operator", "start": 3070, "end": 3086, "strand": 1, "cat": "backbone", "description": "This 17 bp lac operator is a bacterial-backbone binding site adjacent to the lac promoter. LacI can bind the operator and repress transcription from the neighbouring lac control region in compatible bacterial contexts. It lies outside the T7-driven PIE precursor and does not control vaccine-antigen expression in mammalian cells.", "registry": null, "ranges": [[3070, 3086]], "classification": "Annotation", "type": "Vector element", "functionalDescription": "The lac operator is a DNA site bound by LacI repressor. LacI occupancy can reduce transcription from an adjacent lac promoter, while inducer binding changes repressor occupancy; the effect depends on the host strain and the surrounding promoter/operator arrangement.", "functionalRefs": []}, {"id": "lacp", "name": "lac promoter", "start": 3094, "end": 3124, "strand": -1, "cat": "backbone", "description": "This 31 bp reverse-strand lac promoter is retained from the pUC57-derived bacterial backbone. It belongs to the plasmid propagation region and is separate from the T7 promoter used to transcribe the PIE precursor. Its orientation is shown for map fidelity, not to imply mammalian expression of the vaccine cassette.", "registry": null, "ranges": [[3094, 3124]], "classification": "Annotation", "type": "Vector element", "functionalDescription": "The lac promoter is a bacterial RNA-polymerase promoter regulated by the LacI/operator system. Its activity is relevant to bacterial expression and plasmid context, not to translation of the resulting RNA in mammalian cells.", "functionalRefs": []}, {"id": "m13", "name": "M13 rev", "start": 3046, "end": 3062, "strand": -1, "cat": "primer", "description": "A reverse-oriented M13 sequencing-primer binding site in the supplied vector map. Its coordinates describe the template binding region, not a vaccine coding element.", "registry": "BBa_G00104", "ranges": [[3046, 3062]], "classification": "Basic", "type": "Primer", "functionalDescription": "A sequencing or PCR primer anneals to a complementary DNA region and provides a 3′ hydroxyl from which DNA polymerase extends. A mapped binding interval identifies the annealing portion; primer tails or engineered restriction sites may lie outside that interval.", "functionalRefs": [], "alternatives": [{"name": "BBa_G00104", "slug": "bba-g00104", "classification": "Basic", "type": "Primer"}, {"name": "BBa_K4278219", "slug": "bba-k4278219", "classification": "Basic", "type": "Primer"}], "external": true}, {"id": "qh", "name": "Sequencing primer (QH)", "start": 347, "end": 366, "strand": 1, "cat": "primer", "description": "Primer-binding annotation visible in the supplied SnapGene map. The displayed coordinates cover the binding region on this plasmid; prime  "Primer binding site", "functionalDescription": "A sequencing or PCR primer anneals to a complementary DNA region and provides a 3′ hydroxyl from which DNA polymerase extends. A mapped binding interval identifies the annealing portion; primer tails or engineered restriction sites may lie outside that interval.", "functionalRefs": []}, {"id": "siteAgeI", "name": "AgeI", "start": 485, "end": 490, "strand": 1, "cat": "site", "description": "AgeI marks a restriction junction in the upstream circularisation-associated region of the reference plasmid. It is included as a sequence landmark for construct inspection and does not define the TNBC antigen-exchange window or the run-off transcription end.", "registry": null, "ranges": [[485, 490]], "classification": "Annotation", "type": "Restriction site", "cut": 485, "functionalDescription": "A restriction enzyme recognizes a defined double-stranded DNA motif and cleaves at or near that site. Such sites support restriction digest verification, modular cassette design or template linearisation; the biological role depends on the enzyme, cut position and surrounding construct design.", "functionalRefs": []}, {"id": "siteNheI", "name": "NheI", "start": 1492, "end": 1497, "strand": 1, "cat": "site", "description": "NheI marks the 1492–1497 junction between the IRES annotation and the tPA-leader/Kozak translation-initiation region. It helps locate the transition from RNA translation control to the antigen fusion; it is not the restriction pair used to exchange the TNBC epitope array.", "registry": null, "ranges": [[1492, 1497]], "classification": "Annotation", "type": "Restriction site", "cut": 1492, "functionalDescription": "A restriction enzyme recognizes a defined double-stranded DNA motif and cleaves at or near that site. Such sites support restriction digest verification, modular cassette design or template linearisation; the biological role depends on the enzyme, cut position and surrounding construct design.", "functionalRefs": []}, {"id": "siteBamHI", "name": "BamHI", "start": 1600, "end": 1605, "strand": 1, "cat": "site", "description": "BamHI at 1600–1605 marks the upstream edge of the antigen-exchange window. The registered 336 bp eight-slot TNBC epitope array begins at 1606 and is followed by a 15 bp GSGGS linker. This landmark identifies where the replaceable antigen payload sits in the fusion.", "registry": null, "ranges": [[1600, 1605]], "classification": "Annotation", "type": "Restriction site", "cut": 1600, "functionalDescription": "A restriction enzyme recognizes a defined double-stranded DNA motif and cleaves at or near that site. Such sites support restriction digest verification, modular cassette design or template linearisation; the biological role depends on the enzyme, cut position and surrounding construct design.", "functionalRefs": []}, {"id": "siteXhoI", "name": "XhoI", "start": 1957, "end": 1962, "strand": 1, "cat": "site", "description": "XhoI at 1957–1962 follows the final 15 bp GSGGS linker at 1942–1956 and marks the downstream edge of the epitope-array region. Together with BamHI it frames the antigen-exchange interval in the parent construct and separates the array/linker from the four-copy adjuvant module.", "registry": null, "ranges": [[1957, 1962]], "classification": "Annotation", "type": "Restriction site", "cut": 1957, "functionalDescription": "A restriction enzyme recognizes a defined double-stranded DNA motif and cleaves at or near that site. Such sites support restriction digest verification, modular cassette design or template linearisation; the biological role depends on the enzyme, cut position and surrounding construct design.", "functionalRefs": []}, {"id": "siteClaI", "name": "ClaI", "start": 2587, "end": 2592, "strand": 1, "cat": "site", "description": "ClaI marks a junction downstream of the FLAG coding segment and stop codon, before the HBA1 3′ UTR. It is shown as a restriction landmark for reading the plasmid map and is not one of the primary sites used to exchange the TNBC epitope array.", "registry": null, "ranges": [[2587, 2592]], "classification": "Annotation", "type": "Restriction site", "cut": 2588, "functionalDescription": "A restriction enzyme recognizes a defined double-stranded DNA motif and cleaves at or near that site. Such sites support restriction digest verification, modular cassette design or template linearisation; the biological role depends on the enzyme, cut position and surrounding construct design.", "functionalRefs": []}, {"id": "siteMluI", "name": "MluI", "start": 2921, "end": 2926, "strand": 1, "cat": "site", "description": "MluI marks the boundary between the downstream PIE intron segment and the 3′ outer homology arm. This is where the intron-derived region transitions into the arm that pairs with the upstream outer arm during precursor folding.", "registry": null, "ranges": [[2921, 2926]], "classification": "Annotation", "type": "Restriction site", "cut": 2921, "functionalDescription": "A restriction enzyme recognizes a defined double-stranded DNA motif and cleaves at or near that site. Such sites support restriction digest verification, modular cassette design or template linearisation; the biological role depends on the enzyme, cut position and surrounding construct design.", "functionalRefs": []}, {"id": "siteNotI", "name": "NotI", "start": 2972, "end": 2979, "strand": 1, "cat": "site", "description": "NotI is the unique linearisation site used to prepare the DNA template for T7 run-off transcription. Cutting the circular plasmid here defines the downstream template end; the transcript then contains the PIE precursor needed for self-splicing and circle formation. The map records the top-strand cut after base 2973 and the recognition sequence at 2972–2979.", "registry": null, "ranges": [[2972, 2979]], "classification": "Annotation", "type": "Restriction site", "cut": 2973, "functionalDescription": "A restriction enzyme recognizes a defined double-stranded DNA motif and cleaves at or near that site. Such sites support restriction digest verification, modular cassette design or template linearisation; the biological role depends on the enzyme, cut position and surrounding construct design.", "functionalRefs": []}], "composites": [{"id": "whole", "name": "Complete plasmid", "start": 1, "end": 5267, "ranges": [[1, 5267]], "strand": 1, "registry": "BBa_26QYL2YH", "cat": "backbone", "type": "Circular Plasmid", "classification": "Composite", "status": "published", "registryTitle": "pCirCure-circMEV complete plasmid", "description": "The complete 5,267 bp Combined plasmid was ordered from a commercial gene-synthesis supplier and supplied endotoxin-free. Our laboratory workflow began with this plasmid DNA. A purified linearised aliquot supplied the T7 in vitro transcription template.\n\nBases 402-2971 carry the T7-driven PIE precursor cassette. The rest is the pUC57 backbone, including the unique NotI site at 2972, the T7 terminator at 2980-3027, the lac operator and promoter, the pUC/ColE1 origin at 3448-4036, and bla with its promoter at 4207-5172.\n\nThe origin and bla retain their bacterial propagation and selection functions as features of the supplied vector. Bacterial transformation, overnight culture and plasmid amplification were not performed by our team. BamHI, XhoI and NotI are each unique in the plasmid. The BamHI-XhoI interval defines the antigen-cassette interface in the design; NotI provides the linearisation site for transcription.", "length": 5267, "functionalDescription": "This is a complete DNA plasmid template. Its bacterial origin and antibiotic marker are features of the supplied vector backbone, while the T7-driven PIE cassette can be transcribed in vitro and self-spliced to generate a circular RNA containing the translation and antigen modules.", "functionalRefs": []}, {"id": "precursor", "name": "PIE precursor cassette", "start": 402, "end": 2971, "ranges": [[402, 2971]], "strand": 1, "registry": "BBa_26DXB4A5", "cat": "circ", "type": "Engineered Region", "classification": "Composite", "status": "published", "registryTitle": "T7-driven circMEV PIE precursor cassette", "description": "The DNA template for in vitro transcription of the circMEV vaccine RNA. T7 RNA polymerase initiates at the GGG of BBa\\_26KIMH8W and runs off the linearised 3' end, giving one linear precursor whose two PIE halves reconstitute a T4 td group I ribozyme; the ribozyme joins the internal exon ends and releases a closed circle of 2013 nt.\n\nIn that circle synIRES-RC25 recruits eIF4G-eIF4A, so translation initiates at the Kozak-flanked AUG of the tPA leader without a cap; the A-rich spacer after the back-splice junction binds PABP and stops read-through in all three frames. The polypeptide is the tPA leader, eight HLA-A\\*02:01-restricted CTL epitopes from TROP2, B7-H4, Nectin-4 and LIV-1 on GSGGS linkers, four tandem mC3d-P28 copies, the MHC class I trafficking domain and a FLAG tag. tPA is expected to route it into the secretory pathway and MITD into the MHC-I/II loading compartments.\n\nUnique BamHI (1199) and XhoI (1556) flank the array, so the eight slots are exchangeable.", "length": 2570, "functionalDescription": "A permuted intron–exon (PIE) precursor uses a split group I intron to excise and ligate the flanking exon sequence into a circular RNA. Homology arms and local intron structure help bring splice sites together; successful circularisation depends on sequence, folding, substrate length and reaction conditions.", "functionalRefs": ["Wesselhoeft et al., 2018"]}, {"id": "chassis", "name": "Payload-free chassis", "start": 402, "end": 2971, "ranges": [[402, 1605], [1957, 2971]], "strand": 1, "registry": "BBa_26DTP41G", "cat": "circ", "type": "Engineered Region", "classification": "Composite", "status": "published", "registryTitle": "circRNA vaccine chassis: T7-PIE-IRES payload-free cassette", "description": "The CirCure cassette with the epitope array removed, leaving an empty BamHI-XhoI antigen window between the tPA secretion leader and the C3d-P28 adjuvant. Everything a circular RNA vaccine needs apart from the antigen is present and in frame: a T7 promoter with a fixed GGG start, the two PIE halves that circularise the run-off transcript, the PABP-binding spacer with its three-frame stop cassette, synIRES-RC25 for cap-independent initiation, a Kozak sequence, the tPA leader, four tandem copies of murine C3d-P28, the MHC class I trafficking domain, a FLAG tag, a stop codon, HBA1 3'UTR and the poly(A) segment.\n\nOn its own it is expected to give a circular RNA translating a leader-adjuvant-MITD-FLAG fusion carrying no tumour epitope, which makes it a vector-only control for any construct built from it.\n\nIts intended use is as a chassis: a custom in-frame epitope array can be placed into the BamHI-XhoI window in the design file, and the complete construct ordered for template linearisation and cell-free transcription. Both sites are unique in the parent plasmid.", "length": 2219, "functionalDescription": "This composite contains the fixed RNA-production and translation-control scaffold around the exchangeable antigen region. The PIE precursor provides the circularisation framework, while the bacterial origin and resistance marker are features of the vector backbone preceding cell-free in-vitro transcription.", "functionalRefs": ["Wesselhoeft et al., 2018"]}, {"id": "orf", "name": "Antigen fusion ORF", "start": 1504, "end": 2586, "ranges": [[1504, 2586]], "strand": 1, "registry": "BBa_26LQ3XWC", "cat": "traffic", "type": "ORF", "classification": "Composite", "status": "published", "registryTitle": "circMEV multi-epitope antigen ORF", "description": "This open reading frame encodes the whole antigen payload of the CirCure vaccine as one polypeptide. It starts at the AUG of the tPA signal and pro-peptide leader and ends at a single stop codon, so it can be read from an IRES on a circular RNA, from a capped mRNA or from a DNA promoter.\n\nThe tPA leader directs the nascent chain into the ER. The array presents eight HLA-A\\*02:01-restricted CTL epitopes, two each from TROP2, B7-H4, Nectin-4 and LIV-1, separated by GSGGS linkers that keep the flanking residues accessible to the proteasome so each epitope is excised independently. Four tandem copies of murine C3d-P28 follow; C3d-P28 binds CR2/CD21 and is expected to lower the activation threshold of responding lymphocytes. The MHC class I trafficking domain is expected to redirect the product into the MHC-I/II loading compartments, and a C-terminal FLAG tag allows the full-length product to be detected.", "length": 1083, "functionalDescription": "A fusion open reading frame translates linked antigen fragments together with adjuvant and trafficking domains. Translation preserves the encoded order, but functional antigen processing, folding and presentation depend on the full protein and host-cell pathway.", "functionalRefs": ["Kreiter et al., 2008"]}, {"id": "array", "name": "8-slot TNBC epitope array", "start": 1606, "end": 1941, "ranges": [[1606, 1941]], "strand": 1, "registry": "BBa_26DQL85I", "cat": "epitope", "type": "Engineered Region", "classification": "Composite", "status": "published", "registryTitle": "8-slot TNBC CTL epitope array", "description": "A string-of-beads array of eight HLA-A\\*02:01-restricted CTL epitopes, two from each of the four triple-negative breast cancer antigens TROP2, B7-H4, Nectin-4 and LIV-1, joined by GSGGS linkers. Seven are nonamers; the Nectin-4 slot carries a fourteen-residue fragment covering two overlapping predicted binders as one peptide.\n\nThe array is read in a single frame and is designed to sit inside a larger antigen fusion. Each linker is expected to keep the residues flanking an epitope accessible to the proteasome, so the eight peptides are excised independently and loaded onto HLA-A\\*02:01 without the junctions creating new binders or destroying the intended ones. Two epitopes per antigen keeps the four equally function relatedIds(p){const ids=[...(RELATED[p.id]||[])];if(['epitope','linker'].includes(p.cat)){const cartridge=DATA.parts.filter(q=>['epitope','linker'].includes(q.cat)&&q.start>=1606&&q.end<=1956).sort((a,b)=>a.start-b.start),i=cartridge.findIndex(q=>q.id===p.id);if(i>0)ids.push(cartridge[i-1].id);if(i>=0&&i<cartridge.length-1)ids.push(cartridge[i+1].id);ids.push('array','orf')}return [...new Set(ids)].filter(id=>byId.has(id)&&id!==p.id).slice(0,8)}
function detail(p,animate=true){$('part-title').textContent=p.id==='whole'?'pCirCure-circMEV':p.name;$('part-category').textContent=PALETTE[p.cat][2];$('part-dot').style.setProperty('--c',PALETTE[p.cat][0]);const kind=p.classification==='Composite'||p.parentClass==='Composite'?'Composite':p.classification==='Basic'||p.parentClass==='Basic'?'Basic':'Annotation';$('registered-title').textContent=kind==='Basic'||kind==='Composite'?`${kind} part`:'Annotation';
 $('selection-position').textContent=p.id==='whole'?'Full construct':p.classification==='Composite'?'Composite selected':'Feature selected';
 $('registry-field').hidden=!p.registry;$('part-registry').textContent=p.registry||'';
 $('part-position').textContent=p.ranges.map(([s,e])=>`${fmt(s)}–${fmt(e)}`).join(' + ')+' bp';const length=p.length||p.ranges.reduce((n,[s,e])=>n+e-s+1,0);$('part-length').textContent=`${fmt(length)} bp · ${p.strand<0?'reverse (−)':'forward (+)'}`;
 $('part-type').textContent=p.type;$('part-function').innerHTML=String(p.description||'').replace(/\\([_*])/g,'$1').split(/\n\s*\n/).map(t=>`<p>${esc(t)}</p>`).join('');
 const functional=$('part-functional'),functionalText=p.functionalDescription||'General function is described from the annotated element class; experimental activity remains dependent on sequence and biological context.',citations=[...(p.functionalRefs||[])].sort((a,b)=>a.localeCompare(b));functional.textContent=citations.length?functionalText.replace(/\.$/,''):functionalText;if(citations.length){const citation=document.createElement('span');citation.className='citation';citation.textContent=' ('+citations.join('; ')+')';functional.append(citation,document.createTextNode('.'))}
 let [heading,note]=rationale[p.cat]||['Design note',''];if(p.id==='whole'){heading='A reusable vaccine platform';note='The DNA template combines a fixed production and translation backbone with an exchangeable antigen window. The 336 bp epitope array represents the TNBC payload; the other 4,931 bp are unchanged when that array alone is replaced.'}if(p.id==='chassis'){heading='Position refers to the reference plasmid';note='This payload-free composite is 2,219 bp. It omits bases 1606–1956 (the 336 bp array plus the 15 bp downstream linker). Its two displayed ranges refer to pCirCure-circMEV, rather than to coordinates in the shorter chassis sequence.'}$('part-rationale').innerHTML=`<strong>${esc(heading)}</strong>${esc(note)}`;
 const nav=$('related-elements'),related=relatedIds(p);nav.replaceChildren();nav.hidden=!related.length;if(related.length){const h=document.createElement('span');h.className='related-heading';h.textContent='Related elements';nav.append(h);for(const id of related){const button=document.createElement('button');button.type='button';button.className='related-link';button.dataset.relatedPart=id;button.textContent=byId.get(id).name;nav.append(button)}}
 const body=$('info-body');body.scrollTop=0;body.classList.remove('changed');if(animate){void body.offsetWidth;body.classList.add('changed')}
}
function select(id,scroll=false){const p=byId.get(id);if(!p)return;state.selected=id;if(p.classification==='Composite'&&id!=='whole')state.mode='composites';else if(id!=='whole')state.mode='features';if(p.cat==='primer'){state.primers=true;$('show-primers').checked=true}if(p.cat==='site'){state.sites=true;$('show-sites').checked=true}renderMap();detail(p);$('part-select').value=id;if(scroll&&matchMedia('(max-width:800px)').matches)$('part-details').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'start'});}

root.addEventListener('click',ev=>{const related=ev.target.closest('[data-related-part]');if(related){select(related.dataset.relatedPart,true);root.querySelector(`svg [data-part="${related.dataset.relatedPart}"]`)?.focus();return}const part=ev.target.closest('[data-part]');if(part){select(part.dataset.part,true);return}const mode=ev.target.closest('[data-mode]');if(mode){state.mode=mode.dataset.mode;select(state.mode==='composites'?'precursor':'t7p');}});
$('plasmid-map').addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){const target=ev.target.closest('[data-part]');if(target){ev.preventDefault();select(target.dataset.part,true);root.querySelector(`svg [data-part="${target.dataset.part}"]`)?.focus()}}});
$('show-primers').addEventListener('change',ev=>{state.primers=ev.target.checked;renderMap()});$('show-sites').addEventListener('change',ev=>{state.sites=ev.target.checked;renderMap()});$('part-select').addEventListener('change',ev=>select(ev.target.value,true));
const groups=[['Composite parts',DATA.composites],['Parts & features',DATA.parts.filter(p=>p.cat!=='site'&&p.cat!=='primer')],['Restriction sites',DATA.parts.filter(p=>p.cat==='site')],['Primer annotations',DATA.parts.filter(p=>p.cat==='primer')]];
for(const [name,list]of groups){const g=document.createElement('optgroup');g.label=name;for(const p of list){const option=document.createElement('option');option.value=p.id;option.textContent=`${p.name} · ${fmt(p.start)}–${fmt(p.end)} bp`;g.append(option)}$('part-select').append(g)}
$('map-legend').innerHTML=['circ','trans','epitope','linker','adjuvant','traffic','utr','backbone'].map(k=>`<span><i class="dot" style="--c:${PALETTE[k][0]}"></i>${PALETTE[k][2]}</span>`).join('');
select('whole');document.fonts.ready.then(renderMap);
})();
</script>
